[package]
name = "subscription_vault"
version = "0.1.0"
edition = "2021"
description = "Stellarbill prepaid subscription vault - recurring USDC billing on Stellar"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[features]
default = ["oracle-pricing"]
oracle-pricing = []
# Enable this feature when building with `cargo kani` so that the pure-Rust
# verification harnesses in `verification/` are included in the compilation
# unit.  The feature gates `pub use subscription::next_charge_time` (and any
# other internal symbols the harnesses need) without exposing them in normal
# builds or the WASM ABI.
kani_harness = []

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
proptest = "1"
hex = "0.4"
ed25519-dalek = "=2.2"
rand = "0.8"
