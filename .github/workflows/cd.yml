name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: read

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Download CI-built WASM
        id: wasm
        run: |
          set -euo pipefail
          CI_RUN_ID=$(gh run list \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$CI_RUN_ID" ] || [ "$CI_RUN_ID" = "null" ]; then
            echo "No successful CI run found for $GITHUB_SHA"
            exit 1
          fi
          gh run download "$CI_RUN_ID" --name subscription-vault-wasm --dir attested-wasm
          WASM_PATH=attested-wasm/subscription_vault.wasm
          if [ ! -f "$WASM_PATH" ]; then
            echo "Attested WASM not found at $WASM_PATH"
            find attested-wasm -maxdepth 2 -type f -print || true
            exit 1
          fi
          echo "path=$WASM_PATH" >> $GITHUB_OUTPUT

      - name: Verify WASM build attestation
        run: |
          set -euo pipefail
          gh attestation verify "${{ steps.wasm.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          sha256sum "${{ steps.wasm.outputs.path }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.wasm.outputs.path }}
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
